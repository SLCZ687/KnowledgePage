name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!content/**"
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Allow GitHub Pages deployment via GitHub Pages Bot
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private vault
        uses: actions/checkout@v4
        with:
          repository: SLCZ687/KnowledgeBase
          token: ${{ secrets.VAULT_TOKEN }}
          path: content

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
