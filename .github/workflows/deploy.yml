name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!content/**"
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Allow GitHub Pages deployment via GitHub Pages Bot
permissions:
  contents: read
  pages: write
  id-token: write
  variables: write # needed to remember the vault SHA of the last deploy

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout private vault
        uses: actions/checkout@v4
        with:
          repository: SLCZ687/KnowledgeBase
          token: ${{ secrets.VAULT_TOKEN }}
          path: content

      - name: Check if vault changed since last deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cur=$(git -C content rev-parse HEAD)
          prev=$(gh variable get VAULT_SHA 2>/dev/null || echo "")
          echo "vault current:  $cur"
          echo "vault previous: ${prev:-<none>}"
          if [ -n "$prev" ] && [ "$cur" = "$prev" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            gh variable set VAULT_SHA --body "$cur"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
